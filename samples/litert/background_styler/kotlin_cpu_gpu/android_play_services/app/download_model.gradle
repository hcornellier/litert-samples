def modelBaseUrl = 'https://storage.googleapis.com/download.tensorflow.org/models/tflite/task_library/style_transfer/android'

tasks.register('stylePredictModel', Download) {
    src modelBaseUrl + '/magenta_arbitrary-image-stylization-v1-256_fp16_prediction_1.tflite'
    dest project.ext.ASSET_DIR + '/style_predict_fp16.tflite'
    overwrite false
}

tasks.register('styleTransferModel', Download) {
    src modelBaseUrl + '/magenta_arbitrary-image-stylization-v1-256_fp16_transfer_1.tflite'
    dest project.ext.ASSET_DIR + '/style_transfer_fp16.tflite'
    overwrite false
}

preBuild.dependsOn stylePredictModel, styleTransferModel
